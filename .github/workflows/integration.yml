name: CloudPayments integration

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Integration suite"
        required: true
        default: "read"
        type: choice
        options:
          - read
          - full

permissions:
  contents: read

concurrency:
  group: cloudpayments-integration
  cancel-in-progress: false

jobs:
  provider-read:
    name: Provider read contract
    if: inputs.suite == 'read'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CP_TEST_PUBLIC_ID: ${{ secrets.CP_TEST_PUBLIC_ID }}
      CP_TEST_API_SECRET: ${{ secrets.CP_TEST_API_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      - name: Require test-terminal credentials
        run: test -n "$CP_TEST_PUBLIC_ID" && test -n "$CP_TEST_API_SECRET"

      - name: Verify read-only provider contracts
        run: >
          bun test
          test/integration/auth.test.ts
          test/integration/payments.test.ts
          test/integration/subscriptions.test.ts
          test/integration/webhooks.test.ts

  provider-full:
    name: Provider mutation contract
    if: inputs.suite == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudpayments-test
    env:
      CP_TEST_PUBLIC_ID: ${{ secrets.CP_TEST_PUBLIC_ID }}
      CP_TEST_API_SECRET: ${{ secrets.CP_TEST_API_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      - name: Require test-terminal credentials
        run: test -n "$CP_TEST_PUBLIC_ID" && test -n "$CP_TEST_API_SECRET"

      - run: bun run test:integration
