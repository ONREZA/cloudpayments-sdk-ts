name: Sync CloudPayments docs

on:
  schedule:
    # Ежедневно в 03:00 UTC (06:00 МСК).
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-cloudpayments-docs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LEFTHOOK: 0
    steps:
      - name: Require GitHub App configuration
        env:
          SYNC_APP_CLIENT_ID: ${{ secrets.SYNC_APP_CLIENT_ID }}
          SYNC_APP_PRIVATE_KEY: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$SYNC_APP_CLIENT_ID" ] || [ -z "$SYNC_APP_PRIVATE_KEY" ]; then
            echo "::error::Provision SYNC_APP_CLIENT_ID and SYNC_APP_PRIVATE_KEY"
            exit 1
          fi

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Sync docs (scrape → parse → gen)
        id: sync
        run: |
          set +e
          bun run docs:sync
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 100 ]; then
            echo "no_changes=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -ne 0 ]; then
            exit $code
          fi

      - name: Extract docs hash
        if: steps.sync.outputs.no_changes != 'true'
        id: meta
        run: |
          sha=$(jq -r '.source.htmlSha256 // "unknown"' specs/ir.json | cut -c1-12)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.sync.outputs.no_changes != 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: sync/docs
          title: "chore(ir): sync CloudPayments docs → ${{ steps.meta.outputs.sha }}"
          body-path: .sync-report.md
          commit-message: "chore(ir): sync CloudPayments docs → ${{ steps.meta.outputs.sha }}"
          labels: |
            docs-sync
            autogenerated
          delete-branch: true
